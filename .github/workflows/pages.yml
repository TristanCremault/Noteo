name: Publier le site Noteo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'phone/index.html', 'phone/app.js', 'phone/style.css', 'phone/sw.js', 'phone/manifest.webmanifest', 'phone/icons/**', 'phone/bg/**', 'phone/vendor/**', 'scripts/build-site.sh', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
