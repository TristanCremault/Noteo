name: Fabriquer l'APK Noteo (Android)

# Se lance à la main (onglet Actions > "Fabriquer l'APK Noteo" > Run workflow)
# ou automatiquement quand les fichiers de l'appli changent.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'phone/index.html'
      - 'phone/app.js'
      - 'phone/style.css'
      - 'phone/sw.js'
      - 'phone/manifest.webmanifest'
      - 'phone/icons/**'
      - 'phone/bg/**'
      - 'phone/vendor/**'
      - 'phone/capacitor.config.json'
      - 'phone/package.json'
      - 'phone/scripts/**'
      - 'phone/assets/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer les fichiers de l'appli
        run: |
          mkdir -p www
          cp -r index.html app.js style.css manifest.webmanifest sw.js icons bg vendor www/

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icônes et écran de démarrage
        run: npx capacitor-assets generate --android

      - name: Réglages Android (signature, version)
        run: python3 scripts/patch-android.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Copier l'appli dans le projet
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: phone/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Noteo.apk

      - name: Garder l'APK dans les résultats de l'exécution
        uses: actions/upload-artifact@v4
        with:
          name: Noteo-apk
          path: phone/Noteo.apk

      - name: Publier l'APK (page Releases, téléchargeable depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Noteo.apk \
            --title "Noteo pour Android" \
            --notes "APK de Noteo (compilation n°${{ github.run_number }}). Télécharge Noteo.apk sur ton téléphone et ouvre-le pour l'installer."
