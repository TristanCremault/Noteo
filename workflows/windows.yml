name: Fabriquer l'installateur Noteo (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pc/**', '.github/workflows/windows.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier que tous les fichiers sont là
        shell: pwsh
        run: |
          $need = 'package.json','main.js','preload.js','index.html','build/icon.ico','installer/Noteo.iss','installer/assets/slide1.bmp','installer/assets/wizard-164.bmp','fonds-defaut/fond1.jpg','JS/compte.js','CSS/style.css'
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ("Fichiers manquants dans le dossier pc : " + ($missing -join ', ')); exit 1 }

      - name: Installer les dépendances
        run: npm install

      - name: Préparer l'application (electron-builder)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Créer l'installateur
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "installer\Noteo.iss"
          Copy-Item "installer\Output\Noteo-Installateur-$ver.exe" "Noteo-Installateur.exe"

      - name: Garder l'installateur dans les résultats de l'exécution
        uses: actions/upload-artifact@v4
        with:
          name: Noteo-Windows
          path: pc/Noteo-Installateur.exe

      - name: Publier l'installateur (page Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc-latest --yes --cleanup-tag || true
          gh release create pc-latest Noteo-Installateur.exe \
            --title "Noteo pour Windows" \
            --notes "Installateur de Noteo (compilation n°${{ github.run_number }}). Télécharge Noteo-Installateur.exe et lance-le."
